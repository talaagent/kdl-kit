name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: "Remove private configuration values from documents and logs. Report vulnerabilities privately using SECURITY.md."
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest KDL document, and the Rust code or `kdl-pretty` command, that shows the problem.
      render: rust
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the full error (code, message and location) and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Crate names and versions, enabled features, Rust version, and OS.
    validations:
      required: true
