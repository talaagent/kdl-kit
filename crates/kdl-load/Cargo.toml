[package]
name = "kdl-load"
description = "Load KDL files and directories as one document with a source map"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kdl-load"
readme = "README.md"
keywords = ["kdl", "config", "loader", "source-map"]
categories = ["config", "parser-implementations"]
authors.workspace = true

[dependencies]
kdl-tree.workspace = true
kdl-span.workspace = true
thiserror.workspace = true
miette = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }

[features]
default = ["std", "parallel"]
# File and directory loading and `Error::Io`; without it the crate is
# `no_std` + `alloc` and only `load_str` remains.
std = []
parallel = ["std", "dep:rayon"]
miette = ["dep:miette", "kdl-span/miette"]

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.docs.rs]
all-features = true
