[package]
name = "kdl-load"
description = "Load KDL files and directories as one document with a source map"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
kdl-tree.workspace = true
kdl-span.workspace = true
kdl = { workspace = true, optional = true }
thiserror.workspace = true
miette = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }

[features]
default = ["parallel", "kdl-compat"]
parallel = ["dep:rayon"]
# Deprecated, for one release: the `kdl::KdlDocument` view of a load.
kdl-compat = ["dep:kdl", "kdl-tree/kdl", "kdl-span/kdl-compat"]
miette = ["dep:miette", "kdl-span/miette"]

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
