[package]
name = "kdl-tree"
description = "A fast KDL v2 parser into a borrowed document tree with byte spans everywhere"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kdl-tree"
readme = "README.md"
keywords = ["kdl", "parser", "spans", "document-tree"]
categories = ["parser-implementations"]
authors.workspace = true
# The tests need the `kdl` feature through the path dev-dependency on
# this crate (dropped on publish), so they stay in the repository.
exclude = ["tests/"]

[dependencies]
thiserror.workspace = true
kdl = { workspace = true, optional = true }

[features]
# Conversions to and from `kdl::KdlDocument`.
kdl = ["dep:kdl"]

[lints]
workspace = true

[dev-dependencies]
# The tests compare against `kdl` through the conversions.
kdl-tree = { path = ".", features = ["kdl"] }
divan = "0.1"
kdl.workspace = true
proptest.workspace = true

[[bench]]
name = "parse"
harness = false

[package.metadata.docs.rs]
all-features = true
