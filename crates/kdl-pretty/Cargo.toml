[package]
name = "kdl-pretty"
description = "A deterministic, comment-preserving KDL v2 formatter"
version.workspace = true
edition.workspace = true
# Depends on the `kdl` crate, which needs 1.95.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kdl-pretty"
readme = "README.md"
keywords = ["kdl", "formatter", "pretty-printer"]
categories = ["development-tools", "value-formatting"]
authors.workspace = true

[dependencies]
kdl.workspace = true

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true

[package.metadata.docs.rs]
all-features = true
