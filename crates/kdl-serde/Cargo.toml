[package]
name = "kdl-serde"
description = "Serde Serializer and Deserializer for KDL v2 documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
kdl.workspace = true
kdl-span.workspace = true
kdl-load.workspace = true
kdl-nodes.workspace = true
kdl-pretty.workspace = true
serde.workspace = true
thiserror.workspace = true
miette = { workspace = true, optional = true }

[features]
default = ["parallel", "miette"]
parallel = ["kdl-load/parallel"]
miette = ["dep:miette", "kdl-span/miette", "kdl-load/miette", "kdl-nodes/miette"]

[lints]
workspace = true

[dev-dependencies]
insta.workspace = true
miette = { workspace = true, features = ["fancy-no-backtrace"] }
proptest.workspace = true
serde = { workspace = true, features = ["derive"] }
tempfile.workspace = true
