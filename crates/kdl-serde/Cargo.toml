[package]
name = "kdl-serde"
description = "Serde Serializer and Deserializer for KDL v2 documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kdl-serde"
readme = "README.md"
keywords = ["kdl", "serde", "serialization", "config"]
categories = ["encoding", "config", "parser-implementations"]
authors.workspace = true
# Checks docs/errors.md against the whole workspace; repository only.
exclude = ["tests/error_codes.rs"]

[dependencies]
kdl.workspace = true
kdl-tree = { workspace = true, features = ["kdl"] }
kdl-span.workspace = true
kdl-load.workspace = true
kdl-nodes.workspace = true
kdl-pretty.workspace = true
serde.workspace = true
thiserror.workspace = true
miette = { workspace = true, optional = true }

[features]
default = ["parallel"]
parallel = ["kdl-load/parallel"]
miette = ["dep:miette", "kdl-span/miette", "kdl-load/miette", "kdl-nodes/miette"]

[lints]
workspace = true

[dev-dependencies]
divan = "0.1"
insta.workspace = true
miette = { workspace = true, features = ["fancy-no-backtrace"] }
proptest.workspace = true
serde = { workspace = true, features = ["derive"] }
tempfile.workspace = true

[[bench]]
name = "kdl"
harness = false

[package.metadata.docs.rs]
all-features = true
