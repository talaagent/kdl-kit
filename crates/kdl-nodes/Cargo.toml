[package]
name = "kdl-nodes"
description = "Untyped helpers for named KDL nodes and blocks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kdl-nodes"
readme = "README.md"
keywords = ["kdl", "config", "nodes"]
categories = ["config", "parser-implementations"]
authors.workspace = true

[dependencies]
kdl-tree.workspace = true
kdl-span.workspace = true
thiserror.workspace = true
miette = { workspace = true, optional = true }

[features]
miette = ["dep:miette", "kdl-span/miette"]

[lints]
workspace = true

[dev-dependencies]
kdl-load.workspace = true

[package.metadata.docs.rs]
all-features = true
