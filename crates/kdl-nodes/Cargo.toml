[package]
name = "kdl-nodes"
description = "Untyped helpers for named KDL nodes and blocks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
kdl-tree.workspace = true
kdl-span.workspace = true
kdl = { workspace = true, optional = true }
thiserror.workspace = true
miette = { workspace = true, optional = true }

[features]
default = ["kdl-compat"]
# Deprecated, for one release: read `kdl::KdlDocument`s too.
kdl-compat = ["dep:kdl", "kdl-span/kdl-compat"]
miette = ["dep:miette", "kdl-span/miette"]

[lints]
workspace = true

[dev-dependencies]
kdl-load.workspace = true
