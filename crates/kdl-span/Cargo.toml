[package]
name = "kdl-span"
description = "Source maps, spans and diagnostics for KDL documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
kdl-tree.workspace = true
kdl = { workspace = true, optional = true }
miette = { workspace = true, optional = true }

[features]
default = ["kdl-compat"]
# Deprecated, for one release: `Spanned` for `kdl`'s document types.
kdl-compat = ["dep:kdl"]
miette = ["dep:miette"]

[lints]
workspace = true
