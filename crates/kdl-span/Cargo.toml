[package]
name = "kdl-span"
description = "Source maps, spans and diagnostics for KDL documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kdl-span"
readme = "README.md"
keywords = ["kdl", "spans", "source-map", "diagnostics"]
