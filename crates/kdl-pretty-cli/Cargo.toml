[package]
name = "kdl-pretty-cli"
description = "kdl-pretty: format KDL v2 files in place or check them (treefmt-friendly)"
version.workspace = true
edition.workspace = true
# Depends on the `kdl` crate, which needs 1.95.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["kdl", "formatter", "cli", "treefmt"]
categories = ["command-line-utilities", "development-tools"]
authors.workspace = true

[[bin]]
name = "kdl-pretty"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
kdl.workspace = true
kdl-pretty.workspace = true
miette = { workspace = true, features = ["fancy"] }
pico-args.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
