[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
# The default MSRV, edition 2024's floor: kdl-tree (without its `kdl`
# feature), kdl-span, kdl-load and kdl-nodes. The crates that depend on the
# `kdl` crate override it with 1.95 (kdl 6.6+ needs it; 6.5 fails
# kdl-pretty's tests). CI's `msrv` job tests each crate at its own value.
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/talaagent/kdl-kit"
homepage = "https://github.com/talaagent/kdl-kit"
authors = ["Ian Macalinao <github@igm.pub>"]

[workspace.dependencies]
kdl = { version = "6.7", default-features = false, features = ["span"] }
# kdl itself depends on miette (its spans are `miette::SourceSpan`); our
# Diagnostic impls and rendering are behind each crate's `miette` feature.
miette = { version = "7.6", default-features = false }
serde = "1"
# No std: `thiserror` derives `core::error::Error`.
thiserror = { version = "2", default-features = false }
once_cell = { version = "1.21", default-features = false, features = ["race", "alloc"] }
rayon = "1"
anyhow = "1"
pico-args = "0.5"
# Workspace crates: one shared version.
kdl-span = { path = "crates/kdl-span", version = "0.1.1", default-features = false }
kdl-tree = { path = "crates/kdl-tree", version = "0.1.1" }
kdl-load = { path = "crates/kdl-load", version = "0.1.1", default-features = false }
kdl-nodes = { path = "crates/kdl-nodes", version = "0.1.1", default-features = false }
kdl-pretty = { path = "crates/kdl-pretty", version = "0.1.1" }
kdl-serde = { path = "crates/kdl-serde", version = "0.1.1" }
insta = "1"
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
complexity = { level = "deny", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"
# Error types and codes are documented on the error enums and in docs/errors.md.
missing_errors_doc = "allow"
unwrap_used = "deny"
clone_on_ref_ptr = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
