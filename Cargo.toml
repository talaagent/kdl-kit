[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/talaagent/kdl-serde"
authors = ["Ian Macalinao <github@igm.pub>"]
publish = false

[workspace.dependencies]
kdl = { version = "6.7", default-features = false, features = ["span"] }
# kdl itself depends on miette (its spans are `miette::SourceSpan`); our
# Diagnostic impls and rendering are behind each crate's `miette` feature.
miette = { version = "7.6", default-features = false }
serde = "1"
thiserror = "2"
rayon = "1"
kdl-span = { path = "crates/kdl-span" }
kdl-load = { path = "crates/kdl-load", default-features = false }
kdl-nodes = { path = "crates/kdl-nodes" }
kdl-pretty = { path = "crates/kdl-pretty" }
kdl-serde = { path = "crates/kdl-serde" }
insta = "1"
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
clone_on_ref_ptr = "deny"
std_instead_of_core = "warn"
