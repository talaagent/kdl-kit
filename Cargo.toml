[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The MSRV of every crate (CI's `msrv` job reads it from here). kdl 6.6+
# needs 1.95 (6.5 fails kdl-pretty's tests); let chains alone need 1.88.
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/talaagent/kdl-kit"
homepage = "https://github.com/talaagent/kdl-kit"
authors = ["Ian Macalinao <github@igm.pub>"]

[workspace.dependencies]
kdl = { version = "6.7", default-features = false, features = ["span"] }
# kdl itself depends on miette (its spans are `miette::SourceSpan`); our
# Diagnostic impls and rendering are behind each crate's `miette` feature.
miette = { version = "7.6", default-features = false }
serde = "1"
thiserror = "2"
rayon = "1"
anyhow = "1"
pico-args = "0.5"
# Workspace crates: one shared version.
kdl-span = { path = "crates/kdl-span", version = "0.1.0", default-features = false }
kdl-tree = { path = "crates/kdl-tree", version = "0.1.0" }
kdl-load = { path = "crates/kdl-load", version = "0.1.0", default-features = false }
kdl-nodes = { path = "crates/kdl-nodes", version = "0.1.0", default-features = false }
kdl-pretty = { path = "crates/kdl-pretty", version = "0.1.0" }
kdl-serde = { path = "crates/kdl-serde", version = "0.1.0" }
insta = "1"
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
complexity = { level = "deny", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"
# Error types and codes are documented on the error enums and in docs/errors.md.
missing_errors_doc = "allow"
unwrap_used = "deny"
clone_on_ref_ptr = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
